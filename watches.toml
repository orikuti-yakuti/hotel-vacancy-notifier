# ==========================================================
#  監視したい条件をここに書きます（[[watch]] のブロックを増やせば複数監視できます）
#  書き換えたら GitHub 上で「Commit changes」するだけで次回から反映されます
#  ※ 文字は半角の " で囲みます。行頭の # はメモ（無視される行）です
# ==========================================================

# --- 全体の設定 ---
[settings]
quiet_hours = [1, 5]           # この時間帯（日本時間 1:00〜4:59）は自動チェックで通知しない
                               # 夜間も通知したい場合は quiet_hours = [] にする

[[watch]]
name = "蒲田〜横浜"            # 通知に出る名前（自由）
checkin = "2026-12-20"         # チェックイン日
checkout = "2026-12-21"        # チェックアウト日
adults = 1                     # 1部屋あたりの大人の人数
rooms = 1                      # 部屋数

# --- エリア（駅名で指定。複数書けます）---
stations = ["蒲田", "川崎", "鶴見/神奈川県", "横浜"]
radius_km = 1.0                # 各駅から何km以内のホテルを探すか（0.1〜3.0）

# --- 料金（1部屋・1泊あたり、税込）。不要なら行ごと消すか # を付ける ---
min_price = 4000
max_price = 9000

# --- 喫煙・禁煙："禁煙" / "喫煙" / "どちらでも" ---
smoking = "禁煙"

# --- 部屋タイプ（複数可）："シングル" "セミダブル" "ダブル" "ツイン" "トリプル"
#     空の [] にすると部屋タイプは問わない ---
room_types = ["シングル", "ダブル"]

# --- 除外 ---
exclude_capsule = true         # カプセルホテル・ドミトリー・相部屋などを除く
exclude_hotels = []            # 通知してほしくないホテル。名前の一部か楽天の施設番号
                               # 例: exclude_hotels = ["○○イン", "△△ホテル川崎", 123456]
# exclude_keywords = ["カプセルホテル"]  # ホテル名・説明にこの言葉を含むものを除く

# enabled = false              # 一時的に止めたいときは false


# ----------------------------------------------------------
# 2件目の例：特定のホテルだけを監視する（使うときは先頭の # を外す）
# ----------------------------------------------------------
# [[watch]]
# name = "いつものホテル"
# checkin = "2027-01-10"
# checkout = "2027-01-12"
# hotels = [123456, 234567]    # 楽天の施設番号（「ホテル番号を調べる」で確認。15件まで）
# smoking = "どちらでも"
